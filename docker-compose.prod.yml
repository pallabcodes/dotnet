version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: movies-postgres
    environment:
      POSTGRES_DB: movies_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movies-network

  movies-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movies-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: "Server=postgres;Port=5432;Database=movies_db;User ID=postgres;Password=${POSTGRES_PASSWORD:-ChangeMeInProduction}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ApiKey: ${API_KEY}
      Telemetry__OtlpEndpoint: ${OTLP_ENDPOINT:-}
      Telemetry__Prometheus__Enabled: "true"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - movies-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  movies-network:
    driver: bridge

