name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SaaSUsageBilling.sln
      - name: Build
        run: dotnet build SaaSUsageBilling.sln --no-restore -c Release
      - name: Test
        run: dotnet test SaaSUsageBilling.sln --no-build --logger trx

