name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build + test Shared (internal libs)
        run: |
          dotnet build Shared/Shared.sln -c Release
          dotnet test Shared/Shared.sln --no-build -c Release
          dotnet pack Shared/Shared.sln -c Release --no-build
      - name: Build + test service scaffold
        run: |
          dotnet build Template/Template.sln -c Release
          dotnet test Template/Template.sln --no-build -c Release
